<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>
    <nav class="site-nav" aria-label="Main">
      {% for item in site.data.nav %}
        <a href="{{ item.url | relative_url }}"
           {% if page.url == item.url %}class="is-active" aria-current="page"{% endif %}>{{ item.name }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
